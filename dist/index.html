<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAR ECONOMY</title>
<meta name="description" content="A roguelike deckbuilder about the price of winning a war.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">
<style>
/* ============ WAR ECONOMY ============ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #14161a;
  --panel: #1e222a;
  --panel2: #252b35;
  --line: #363d4a;
  --text: #e6e2d8;
  --dim: #8b93a3;
  --amber: #e8b84b;
  --red: #d05050;
  --green: #6dbf6d;
  --blue: #5aa0d8;
  --purple: #a97fd8;
  --dirty: #c23a3a;
}

html, body { height: 100%; }
body {
  background: radial-gradient(1200px 600px at 50% -100px, #232a36 0%, var(--bg) 60%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
               /* CJK */
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC",
               "PingFang TC", "Microsoft JhengHei",
               "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo",
               "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR",
               /* Arabic + Devanagari + Thai */
               "Geeza Pro", "Segoe UI Arabic", "Noto Sans Arabic",
               "Kohinoor Devanagari", "Nirmala UI", "Noto Sans Devanagari",
               sans-serif;
  overflow-x: hidden;
}
body.shake { animation: shake .35s; }
@keyframes shake {
  0%,100% { transform: translate(0,0); }
  20% { transform: translate(-7px,3px); }
  40% { transform: translate(6px,-4px); }
  60% { transform: translate(-5px,2px); }
  80% { transform: translate(4px,-2px); }
}

#app { max-width: 580px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 10px; }

button { font: inherit; color: inherit; cursor: pointer; }

.btn {
  background: linear-gradient(180deg, #f3c95e, #d9a635);
  color: #241c08;
  border: none;
  border-radius: 8px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 14px 26px;
  min-height: 48px;
  box-shadow: 0 3px 0 #8f6c1c, 0 6px 16px rgba(0,0,0,.4);
  transition: transform .06s, box-shadow .06s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #8f6c1c; }
.btn.big { font-size: 20px; padding: 16px 34px; }
.btn.ghost {
  background: var(--panel2); color: var(--text);
  box-shadow: 0 3px 0 #10131a; border: 1px solid var(--line);
}

/* ---------- generic screens ---------- */
.screen {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; gap: 18px; padding: 24px 8px;
  animation: fadein .35s ease; position: relative;
}
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

.logo {
  font-family: "Arial Black", "Arial Bold", sans-serif;
  font-size: clamp(44px, 12vw, 72px);
  line-height: .95;
  letter-spacing: .04em;
  color: var(--amber);
  text-shadow: 0 4px 0 #6b5316, 0 8px 24px rgba(0,0,0,.6);
}
.logo span { display: block; color: var(--text); font-size: .62em; letter-spacing: .28em; }
.tag { color: var(--dim); font-style: italic; max-width: 380px; }
.howto { list-style: none; text-align: left; color: var(--dim); max-width: 400px; display: grid; gap: 10px; font-size: 14.5px; }
.howto li { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }

h1.screen-title {
  font-family: "Arial Black", "PingFang SC", "Microsoft YaHei", "Hiragino Kaku Gothic ProN",
               "Apple SD Gothic Neo", sans-serif;
  letter-spacing: .08em; text-transform: uppercase;
  font-size: clamp(24px, 7vw, 34px); color: var(--amber);
}

/* ---------- language switch ---------- */
.corner-bar { position: absolute; top: 12px; inset-inline-end: 12px; z-index: 5; }
.lang-btn {
  font-size: 12px; font-weight: 800; letter-spacing: .05em;
  padding: 0 9px; min-width: 44px; min-height: 36px;
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
}
.lang-btn span { font-size: 11px; }

.lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
@media (max-width: 400px) { .lang-grid { grid-template-columns: 1fr; } }
.lang-option {
  display: flex; align-items: center; gap: 8px; text-align: start;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 10px; min-height: 44px; font-size: 13.5px; color: var(--text);
  transition: border-color .08s, transform .06s;
}
.lang-option:hover, .lang-option:active { border-color: var(--amber); transform: translateY(-1px); }
.lang-option.current { border-color: var(--amber); background: #3a3320; font-weight: 700; }
.lang-flag { font-size: 18px; line-height: 1; }

/* Native-script line under the wordmark (CJK / Arabic / Devanagari) */
.logo-zh {
  font-weight: 800; font-size: clamp(15px, 4.2vw, 20px);
  letter-spacing: .3em; color: var(--dim); margin-top: -8px; text-indent: .3em;
}

/* ---------- per-script typography ----------
   Latin sizes read too small in these scripts; nudge the dense spots up. */
:root:lang(zh), :root:lang(ja), :root:lang(ko) {
  --script-bump: 1;
}
:lang(zh) .card .cname, :lang(ja) .card .cname, :lang(ko) .card .cname,
:lang(ar) .card .cname, :lang(hi) .card .cname { font-size: 13px; }
:lang(zh) .card .ctext, :lang(ja) .card .ctext, :lang(ko) .card .ctext,
:lang(ar) .card .ctext, :lang(hi) .card .ctext { font-size: 12px; }
:lang(zh) .card .cflavor, :lang(ja) .card .cflavor, :lang(ko) .card .cflavor,
:lang(ar) .card .cflavor, :lang(hi) .card .cflavor { font-size: 10px; }
:lang(zh) .chip, :lang(ja) .chip, :lang(ko) .chip,
:lang(ar) .chip, :lang(hi) .chip { font-size: 12px; }
:lang(zh) .howto, :lang(ja) .howto, :lang(ko) .howto,
:lang(ar) .howto, :lang(hi) .howto { font-size: 14px; line-height: 1.65; }
:lang(zh) .intent-label, :lang(ja) .intent-label, :lang(ko) .intent-label { letter-spacing: .08em; }
:lang(zh) .btn, :lang(ja) .btn, :lang(ko) .btn { letter-spacing: .12em; }
:lang(zh) .cause, :lang(ja) .cause, :lang(ko) .cause { letter-spacing: .04em; }

/* Arabic and Devanagari need line-height room and no uppercasing/spacing tricks */
:lang(ar) body, :lang(hi) body { line-height: 1.6; }
:lang(ar) .screen-title, :lang(hi) .screen-title,
:lang(ar) .btn, :lang(hi) .btn,
:lang(ar) .vs-badge, :lang(hi) .vs-badge,
:lang(ar) .intent-label, :lang(hi) .intent-label {
  text-transform: none; letter-spacing: normal;
}
:lang(ar) .logo span { letter-spacing: .28em; }  /* wordmark stays Latin */
:lang(hi) .cause, :lang(ar) .cause { line-height: 1.5; }

/* ---------- RTL ---------- */
/* Numeric/icon composites (⚔️11, 💰 4, ❤️ 38/50) are not prose — the bidi
   algorithm reorders them into nonsense, so pin them LTR. Their position in
   the mirrored layout still follows the RTL flex flow. */
[dir="rtl"] .intent,
[dir="rtl"] .pop,
[dir="rtl"] #gold-text,
[dir="rtl"] .hp-line span,
[dir="rtl"] #usa-clock,
[dir="rtl"] .repbar,
[dir="rtl"] .card .cost,
[dir="rtl"] #pile-info { direction: ltr; }
[dir="rtl"] .hp-line span { unicode-bidi: isolate; }

[dir="rtl"] .hand { flex-direction: row-reverse; }
[dir="rtl"] .card .cost { left: auto; right: -7px; }
[dir="rtl"] .card .repcost { right: auto; left: -6px; }
[dir="rtl"] .card, [dir="rtl"] .country-card,
[dir="rtl"] .intel, [dir="rtl"] .howto li { text-align: right; }
[dir="rtl"] .stat-grid .k { text-align: left; }
[dir="rtl"] .stat-grid .v { text-align: right; }
[dir="rtl"] #usa-clock { right: auto; left: 12px; }
.subtitle { color: var(--dim); font-style: italic; font-size: 14px; }

/* ---------- country select / intro ---------- */
.country-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 460px; }
@media (max-width: 430px) { .country-grid { grid-template-columns: 1fr; } }
.country-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 6px;
  transition: transform .08s, border-color .08s; min-height: 44px;
}
.country-card:hover, .country-card:active { transform: translateY(-2px); border-color: var(--amber); }
.country-card .flag { font-size: 30px; }
.country-card .cname { font-weight: 800; letter-spacing: .04em; }
.country-card .cintro { color: var(--dim); font-size: 12.5px; font-style: italic; }

.vs-badge {
  display: inline-block; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 14px; font-size: 12px; letter-spacing: .18em;
  color: var(--dim); text-transform: uppercase;
}
.vs-badge.boss { color: #ff9e9e; border-color: var(--dirty); background: #3a1e1e; }
.intro-flag { font-size: 74px; line-height: 1; filter: drop-shadow(0 6px 12px rgba(0,0,0,.5)); }
.intro-name { font-family: "Arial Black", sans-serif; font-size: 30px; letter-spacing: .05em; }
.intro-quote { color: var(--text); font-style: italic; max-width: 400px; font-size: 16px; }
.intel {
  background: var(--panel); border: 1px dashed var(--line); border-radius: 10px;
  padding: 12px 16px; max-width: 420px; color: var(--dim); font-size: 13.5px; text-align: left;
}
.intel b { color: var(--amber); }
.mini-stats { color: var(--dim); font-size: 13px; }

/* ---------- battle layout ---------- */
.battle { flex: 1; display: flex; flex-direction: column; gap: 8px; animation: fadein .3s; }

.topbar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.topbar .battle-no { letter-spacing: .12em; font-weight: 700; white-space: nowrap; }
#rep-box { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
.repbar { flex: 1; height: 8px; background: #10131a; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.repbar > div { height: 100%; background: var(--green); transition: width .3s, background .3s; }
.rep-title { white-space: nowrap; font-size: 11px; }
.icon-btn {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  min-width: 44px; min-height: 36px; font-size: 15px; color: var(--text);
}

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; position: relative;
}

/* enemy */
#usa-clock {
  position: absolute; top: -10px; right: 12px; background: #3a1e1e; border: 1px solid var(--dirty);
  color: #ffb3b3; border-radius: 8px; padding: 3px 10px; font-weight: 800; font-size: 14px;
  letter-spacing: .06em; box-shadow: 0 0 12px rgba(210,60,60,.35);
}
.enemy-head { display: flex; align-items: center; gap: 12px; }
.enemy-flag { font-size: 44px; line-height: 1; }
.enemy-flag.soviet-flag { color: #e33; }
.enemy-name { font-weight: 800; letter-spacing: .05em; font-size: 17px; display: flex; gap: 8px; align-items: center; }
.boss-tag { font-size: 10px; background: #3a1e1e; color: #ff9e9e; border: 1px solid var(--dirty); border-radius: 4px; padding: 2px 6px; letter-spacing: .1em; }

.hpbar { height: 14px; background: #10131a; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); margin-top: 5px; }
.hpbar > div { height: 100%; background: linear-gradient(180deg,#e26060,#b83e3e); transition: width .3s; }
.hpbar.player > div { background: linear-gradient(180deg,#74c874,#4d9e4d); }
.hp-line { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 3px; background: var(--panel2);
  border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; font-size: 11.5px; color: var(--text);
}
.chip.warnchip { border-color: var(--dirty); color: #ffb3b3; }

.status-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; min-height: 0; }

.intent-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.intent-label { font-size: 10px; letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }
.intent {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 12px; font-weight: 800; font-size: 16px;
}
.intent.future { opacity: .5; font-size: 13px; padding: 4px 9px; }
.intent.unknown { color: var(--dim); border-style: dashed; letter-spacing: .12em; }
.intent.warn { border-color: var(--dirty); color: #ffb3b3; background: #33191c; animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 14px rgba(220,70,70,.5); } }
.warn-text { color: #ff9e9e; font-size: 12.5px; font-style: italic; margin-top: 6px; }

#battle-log {
  min-height: 22px; text-align: center; font-size: 13.5px; color: var(--amber);
  font-style: italic; padding: 0 6px;
}
#battle-log.flash { animation: logflash .5s; }
@keyframes logflash { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

/* player */
.gold-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.gold-big { font-weight: 800; font-size: 19px; color: var(--amber); }
.gold-big.broke { color: #ff7a7a; }
.income-note { font-size: 11.5px; color: var(--dim); }

/* hand */
.hand {
  display: flex; gap: 7px; overflow-x: auto; padding: 4px 2px 8px;
  scrollbar-width: thin; min-height: 150px;
}
.card {
  flex: 1 0 106px; max-width: 128px; min-height: 196px;
  background: linear-gradient(180deg, #262c37, #1d222b);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px;
  display: flex; flex-direction: column; gap: 4px; text-align: left; position: relative;
  transition: transform .08s, border-color .08s, opacity .2s;
  user-select: none;
}
button.card:hover, button.card:active { transform: translateY(-4px); }
.card .cost {
  position: absolute; top: -7px; left: -7px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--amber); color: #241c08; font-weight: 900; font-size: 14px;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,.5);
}
.card .cost.discount { background: var(--green); color: #0c2410; }
.card .cname { font-weight: 800; font-size: 12px; line-height: 1.15; margin-top: 6px; }
.card .ctext { font-size: 11px; color: #c8cdd8; line-height: 1.25; flex: 1; }
.card .cflavor { font-size: 9px; color: var(--dim); font-style: italic; line-height: 1.2; }
.card .repcost {
  position: absolute; top: -7px; right: -6px; background: var(--dirty); color: #fff;
  font-size: 9px; font-weight: 800; border-radius: 5px; padding: 2px 5px; letter-spacing: .05em;
}
.card.mil { border-top: 3px solid var(--red); }
.card.bld { border-top: 3px solid var(--blue); }
.card.pol { border-top: 3px solid var(--purple); }
.card.dirty { background: linear-gradient(180deg, #2e2128, #1f1a1e); border-color: #5c3038; }
.card.unplayable { opacity: .45; }
button.card.unplayable:hover { transform: none; }
@media (max-width: 420px) { .card .cflavor { display: none; } .card { min-height: 160px; } }

/* actions */
.actions { display: flex; align-items: center; gap: 10px; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
#pile-info { flex: 1; font-size: 11.5px; color: var(--dim); }
#send-it { min-width: 130px; }
#send-it:disabled { opacity: .5; }

/* reward cards */
.reward-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.reward-row .card { flex: 0 0 150px; max-width: 160px; min-height: 234px; }
.reward-row .card .cname { font-size: 14px; }
.reward-row .card .ctext { font-size: 12.5px; }
.reward-row .card .cflavor { font-size: 10.5px; display: block; }

/* fx */
#fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.pop {
  position: absolute; font-weight: 900; font-size: 26px; transform: translate(-50%,-50%);
  animation: popfloat 1s ease-out forwards; text-shadow: 0 2px 6px rgba(0,0,0,.7);
  white-space: nowrap;
}
.pop-dmg { color: #ff6b6b; }
.pop-heal { color: var(--green); }
.pop-block { color: #9db8d8; font-size: 20px; }
.pop-steal { color: var(--amber); font-size: 20px; }
@keyframes popfloat {
  0% { opacity: 0; transform: translate(-50%,-30%) scale(.6); }
  15% { opacity: 1; transform: translate(-50%,-55%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%,-150%) scale(1); }
}

/* banner overlay */
.banner-overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(10,12,16,.65); z-index: 100; animation: fadein .2s; padding: 20px;
}
.banner-overlay.out { opacity: 0; transition: opacity .3s; }
.banner { text-align: center; }
.banner h2 {
  font-family: "Arial Black", sans-serif; font-size: clamp(34px, 10vw, 54px);
  color: var(--amber); letter-spacing: .06em; text-transform: uppercase;
  text-shadow: 0 4px 0 #6b5316, 0 10px 30px rgba(0,0,0,.8);
}
.banner h2.bad { color: #ff6b6b; text-shadow: 0 4px 0 #5c1a1a, 0 10px 30px rgba(0,0,0,.8); }
.banner p { color: var(--text); margin-top: 8px; font-style: italic; }

/* modal */
#modal-root:empty { display: none; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(10,12,16,.75); z-index: 90;
  display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadein .15s;
}
.modal {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; max-width: 360px; width: 100%; display: flex; flex-direction: column; gap: 12px;
  max-height: 80dvh; overflow-y: auto;
}
.modal h3 { color: var(--amber); letter-spacing: .05em; }
.modal .btn { width: 100%; font-size: 14px; }
.modal .btn:disabled { opacity: .4; cursor: default; }
.deck-list { font-size: 13px; color: var(--text); display: grid; gap: 4px; }
.deck-list span { color: var(--dim); }

/* ---------- pixel art ---------- */
.pix {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
}
.pixwrap { display: inline-flex; justify-content: center; }
/* country sprite sizes per context (intrinsic 24×18) */
.country-card .pix-co { width: 72px; height: 54px; }
.intro-flag .pix-co { width: 144px; height: 108px; filter: drop-shadow(0 6px 12px rgba(0,0,0,.5)); }
.enemy-flag .pix-co { width: 72px; height: 54px; animation: pixbob 2.4s ease-in-out infinite; }
@keyframes pixbob { 50% { transform: translateY(-3px); } }
/* card art (intrinsic 16×12) */
.cart { display: flex; justify-content: center; padding-top: 6px; }
.pix-card { width: 64px; height: 48px; }
.pix-mini { width: 16px; height: 12px; display: inline-block; }
.cfaction .pix-mini { vertical-align: middle; }
@media (max-width: 420px) {
  .pix-card { width: 48px; height: 36px; }
  .enemy-flag .pix-co { width: 56px; height: 42px; }
}

/* ---------- between-battle dilemmas ---------- */
.dil-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.dil-row .btn { min-width: 150px; }

/* ---------- difficulty picker ---------- */
.diff-row { display: flex; gap: 10px; width: 100%; max-width: 460px; }
.diff-btn {
  flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; text-align: start; color: var(--dim);
  display: flex; flex-direction: column; gap: 2px; min-height: 44px;
  transition: border-color .08s, transform .06s;
}
.diff-btn b { color: var(--text); font-size: 14px; letter-spacing: .04em; }
.diff-btn span { font-size: 11.5px; font-style: italic; }
.diff-btn.on { border-color: var(--amber); background: #2b2718; }
.diff-btn.on b { color: var(--amber); }
.diff-btn.hell.on { border-color: var(--dirty); background: #3a1e1e; }
.diff-btn.hell.on b { color: #ff9e9e; }
.diff-btn.endless.on { border-color: var(--purple); background: #2b2038; }
.diff-btn.endless.on b { color: #d4b4f0; }
/* 三档难度在窄屏上竖排,免得挤成一团 */
@media (max-width: 560px) { .diff-row { flex-direction: column; } }
.streak-badge {
  font-size: 12px; color: var(--purple); letter-spacing: .06em;
  border: 1px solid var(--purple); border-radius: 999px; padding: 4px 14px;
}
.diff-btn:hover { transform: translateY(-1px); }

/* ---------- help / faction pros-cons ---------- */
.title-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.title-btns .btn { font-size: 13px; padding: 10px 16px; }
.cpro { color: var(--green); font-size: 11.5px; line-height: 1.3; }
.ccon { color: #ff9e9e; font-size: 11.5px; line-height: 1.3; }
.help-modal { max-width: 440px; }
.help-scroll { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.help-list { margin: 0; padding-inline-start: 18px; display: grid; gap: 7px; }
.help-list li { font-size: 13px; line-height: 1.45; color: var(--text); }
.fac-row {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 11px; display: flex; flex-direction: column; gap: 3px; text-align: start;
}
.fac-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fac-head b { font-size: 14px; }
.fac-flag .pix-co { width: 32px; height: 24px; }
.fac-arch { font-size: 10.5px; color: var(--amber); font-weight: 800; letter-spacing: .04em; }
[dir="rtl"] .help-list { padding-inline-start: 18px; }

/* ---------- war chest / funded moves ---------- */
#enemy-chest { color: var(--amber); font-weight: 700; }
.fund {
  display: inline-block; margin-inline-start: 6px; padding: 1px 5px;
  background: #3a3320; border: 1px solid var(--amber); border-radius: 5px;
  font-size: 11px; color: var(--amber); vertical-align: 2px;
}
.fund.broke { text-decoration: line-through; opacity: .6; border-style: dashed; }
[dir="rtl"] .fund { direction: ltr; }

/* ---------- faction bits ---------- */
.country-card .carch { color: var(--amber); font-size: 11px; font-weight: 800; letter-spacing: .06em; }
.country-card .csig { color: var(--dim); font-size: 11.5px; }
.card .cfaction {
  position: absolute; bottom: -7px; right: -6px; font-size: 12px;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px;
}
[dir="rtl"] .card .cfaction { right: auto; left: -6px; }

/* ---------- achievements ---------- */
.badge-gold {
  background: linear-gradient(180deg, #3a3320, #2b2718);
  border: 1px solid var(--amber); border-radius: 10px; padding: 8px 16px;
  color: var(--amber); font-weight: 800; letter-spacing: .08em;
  display: flex; flex-direction: column; gap: 2px; align-items: center;
  box-shadow: 0 0 18px rgba(232,184,75,.25);
}
.badge-gold span { font-size: 11px; color: var(--dim); font-weight: 400; letter-spacing: normal; font-style: italic; }

.ach-scroll {
  width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 6px;
  background: var(--panel); border: 1px solid var(--amber); border-radius: 10px; padding: 12px;
}
.ach-scroll-title { color: var(--amber); font-weight: 800; letter-spacing: .12em; font-size: 12px; }
.ach-item {
  display: flex; gap: 10px; align-items: center; text-align: start;
  opacity: 0; animation: achpop .5s ease forwards;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
.ach-item b { display: block; font-size: 13.5px; color: var(--amber); }
.ach-item span { font-size: 11.5px; color: var(--dim); font-style: italic; }
@keyframes achpop {
  0% { opacity: 0; transform: translateY(10px) scale(.95); }
  60% { opacity: 1; transform: translateY(-2px) scale(1.03); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.ach-modal { max-width: 420px; }
.ach-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
.ach-sec {
  color: var(--amber); font-weight: 800; letter-spacing: .1em; font-size: 11px;
  text-transform: uppercase; margin-top: 8px;
}
.ach-row {
  display: flex; gap: 10px; align-items: center; text-align: start;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
}
.ach-row b { display: block; font-size: 13px; }
.ach-row span { font-size: 11px; color: var(--dim); }
.ach-row .ach-cond { display: block; color: var(--text); opacity: .8; line-height: 1.35; }
.ach-row .ach-flavor { display: block; font-style: italic; margin-top: 2px; }
.ach-row.locked { opacity: .55; }
.ach-row.locked b { color: var(--dim); }
.ach-ico { font-size: 18px; }
[dir="rtl"] .ach-row, [dir="rtl"] .ach-item { text-align: right; }

/* death / victory */
.cause {
  font-family: "Arial Black", sans-serif; font-size: clamp(22px, 6.5vw, 32px);
  color: #ff6b6b; letter-spacing: .03em;
}
.stat-grid {
  display: grid; grid-template-columns: auto auto; gap: 6px 18px; font-size: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 20px;
}
.stat-grid .k { color: var(--dim); text-align: right; }
.stat-grid .v { font-weight: 700; text-align: left; }

/* ==== i18n.js ==== */
"use strict";
/* ============================================================
   WAR ECONOMY — localization engine
   Mechanics live in game.js. Every player-facing string lives in
   lang/<code>.js and registers itself here.

   To add a language: copy lang/en.js, translate, add a <script>
   tag in index.html. Nothing else needs to change.

   Localize, don't translate: this game's voice is slang and dark
   jokes. A literal rendering kills it. Rewrite the joke so it
   lands in the target language.
   ============================================================ */

const LANGS = [];      // ordered [{code, name, flag, rtl}] for the picker
const REGISTRY = {};   // code -> { cards, countries, deaths, strings }

function registerLang(meta, data) {
  LANGS.push(meta);
  REGISTRY[meta.code] = data;
}
function langMeta(code) {
  return LANGS.find(l => l.code === code) || LANGS.find(l => l.code === "en");
}

let LANG = "en";

/** Saved choice → English.
 *  English is the default for everyone: the game is written in English first
 *  and the other 17 packs are transcreations of it, so a first-time player
 *  should meet the original voice and switch deliberately via the 🌐 picker. */
function detectLang() {
  try {
    const saved = localStorage.getItem("we_lang");
    if (saved && REGISTRY[saved]) return saved;
  } catch (e) { /* file:// has no storage; fall through */ }
  return "en";
}

function setLang(code) {
  if (!REGISTRY[code]) code = "en";
  LANG = code;
  try { localStorage.setItem("we_lang", code); } catch (e) { /* ignore */ }
  const meta = langMeta(code);
  document.documentElement.lang = code;
  document.documentElement.dir = meta.rtl ? "rtl" : "ltr";
}

/* ---- lookups, all falling back to English ---- */
function pack(code) { return REGISTRY[code] || REGISTRY.en; }

/** T("key") or T("key", ...args) for parameterized strings. */
function T(key, ...args) {
  let s = pack(LANG).strings[key];
  if (s === undefined) s = REGISTRY.en.strings[key];
  if (s === undefined) return key;
  return typeof s === "function" ? s(...args) : s;
}

function cardField(id, field) {
  const c = pack(LANG).cards[id] || REGISTRY.en.cards[id];
  return (c && c[field] !== undefined) ? c[field] : REGISTRY.en.cards[id][field];
}
const cardName   = id => cardField(id, "name");
const cardText   = id => cardField(id, "text");
const cardFlavor = id => cardField(id, "flavor");

function coField(id, field) {
  const c = pack(LANG).countries[id] || REGISTRY.en.countries[id];
  return (c && c[field] !== undefined) ? c[field] : REGISTRY.en.countries[id][field];
}
const coName    = id => coField(id, "name");
const coIntro   = id => coField(id, "intro");
const coGimmick = id => coField(id, "gimmick");

function deathText(cause) {
  return pack(LANG).deaths[cause] || REGISTRY.en.deaths[cause];
}

/* ---- achievements ----
   Each pack may carry `ach: { id: { name, text, hint } }`.
   Matchup hints are derived from one parameterized string. */
function achField(id, field) {
  const p = pack(LANG).ach || {};
  const a = p[id] || (REGISTRY.en.ach || {})[id] || {};
  if (a[field] !== undefined) return a[field];
  const en = (REGISTRY.en.ach || {})[id] || {};
  return en[field] !== undefined ? en[field] : id;
}
const achName = id => achField(id, "name");
const achText = id => achField(id, "text");
function achHint(id) {
  if (id.startsWith("m_")) {
    const [, p, e] = id.split("_");
    return T("ach_matchup_hint", coName(p), coName(e));
  }
  return achField(id, "hint");
}

/** Locale for sorting the deck list — pinyin for Chinese, native elsewhere. */
function sortLocale() {
  if (LANG === "zh-Hans" || LANG === "zh-Hant") return "zh-Hans-u-co-pinyin";
  return LANG;
}

/* ---------------- renderer ---------------- */
const pixCache = {};

function pixURL(kind, id) {
  const key = kind + ":" + id;
  if (key in pixCache) return pixCache[key];
  let url = null;
  try {
    const rows = PIX[kind] && PIX[kind][id];
    if (rows) {
      const h = rows.length, w = rows[0].length;
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d");
      for (let y = 0; y < h; y++) {
        const row = rows[y];
        for (let x = 0; x < w; x++) {
          const ch = row[x];
          if (ch !== "." && ch !== " " && PIX_PAL[ch]) {
            ctx.fillStyle = PIX_PAL[ch];
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }
      url = cv.toDataURL();
    }
  } catch (e) {
    url = null; // no canvas (old browser / tests) → callers fall back to emoji
  }
  pixCache[key] = url;
  return url;
}

function pixImg(kind, id, cls) {
  const u = pixURL(kind, id);
  return u ? `<img class="pix ${cls}" src="${u}" alt="">` : "";
}

"use strict";
/* ============================================================
   WAR ECONOMY — a roguelike deckbuilder about the price of winning
   Pure front-end SPA. No server, no saves (achievements excepted),
   no mercy. Implements the Consolidated Edition spec.
   ============================================================ */

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

/* ---------------- audio (WebAudio synth, no assets) ----------------
   Phones need two things desktop doesn't:
   1. A fresh AudioContext is suspended until it is resumed inside a real
      user gesture, so we unlock on the first touch anywhere on the page.
   2. iOS routes Web Audio through the ringer, which means the hardware
      silent switch mutes the game. Declaring a "playback" audio session
      (Safari 16.4+) opts out of that. */
let audioCtx = null, muted = false, audioUnlocked = false;

function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function unlockAudio() {
  if (audioUnlocked) return;
  try {
    if (navigator.audioSession) navigator.audioSession.type = "playback";
  } catch (e) { /* older Safari: no session API, silent switch still applies */ }
  try {
    const c = ac();
    // playing one silent sample is what actually flips iOS out of "suspended"
    const src = c.createBufferSource();
    src.buffer = c.createBuffer(1, 1, 22050);
    src.connect(c.destination);
    src.start(0);
    if (c.state === "running") {
      audioUnlocked = true;
      bgm.resume();          // a battle may already be waiting for music
    }
  } catch (e) { /* try again on the next gesture */ }
}

if (typeof document !== "undefined" && document.addEventListener) {
  for (const evt of ["pointerdown", "touchend", "click", "keydown"]) {
    document.addEventListener(evt, unlockAudio, { passive: true });
  }
  // coming back from a locked screen or another tab leaves the context suspended
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(() => {});
    }
  });
}
function tone(freq, dur, type = "square", vol = 0.1, delay = 0, slideTo = 0) {
  if (muted) return;
  try {
    const c = ac(), o = c.createOscillator(), g = c.createGain();
    o.type = type;
    const t = c.currentTime + delay;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo > 0) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) { /* audio is a nice-to-have */ }
}
function noise(dur, vol = 0.2, delay = 0) {
  if (muted) return;
  try {
    const c = ac(), n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(g); g.connect(c.destination);
    src.start(c.currentTime + delay);
  } catch (e) { /* ignore */ }
}

/* ---------------- battle BGM ----------------
   A synthesized chiptune march loop: triangle bass, quiet square
   arpeggio, noise-tick hats. Lookahead scheduler so timing stays
   tight; the boss fight runs a notch faster. Silently does nothing
   when WebAudio is unavailable (tests, ancient browsers). */
const bgm = {
  timer: null, next: 0, step: 0, boss: false, wanted: false,
  // A natural-minor bass line, one note per half-beat slot (MIDI numbers)
  bass: [45, 45, 45, 48, 41, 41, 41, 45, 43, 43, 43, 47, 40, 40, 43, 47],
  arp: [0, 3, 7, 12],
  start(boss = false) {
    this.wanted = true;
    this.boss = boss;
    if (muted || this.timer) return;
    try { ac(); } catch (e) { return; }
    this.step = 0;
    this.next = ac().currentTime + 0.06;
    this.timer = setInterval(() => this.tick(), 80);
  },
  stop() {
    this.wanted = false;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  },
  pause() { // mute toggle: stop playback but remember we want music
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  },
  resume() { if (this.wanted && !this.timer) { const b = this.boss; this.wanted = false; this.start(b); } },
  tick() {
    try {
      const c = ac();
      // a suspended context has a frozen clock — don't pile up notes that
      // would all fire at once the moment it resumes
      if (c.state !== "running") { this.next = c.currentTime + 0.06; return; }
      const spb = this.boss ? 0.135 : 0.165; // seconds per half-beat
      if (this.next < c.currentTime - 0.5) this.next = c.currentTime + 0.06; // fell behind: resync
      while (this.next < c.currentTime + 0.22) {
        this.sched(this.next - c.currentTime, this.step);
        this.step = (this.step + 1) % 32;
        this.next += spb;
      }
    } catch (e) { this.pause(); }
  },
  sched(delay, s) {
    const f = m => 440 * Math.pow(2, (m - 69) / 12);
    const root = this.bass[s % 16];
    if (s % 2 === 0) tone(f(root - 12), .14, "triangle", .045, delay);      // bass
    if (s % 4 === 2) noise(.018, .022, delay);                              // hat
    if (s % 8 === 1 || s % 8 === 5)                                         // sparse arpeggio
      tone(f(root + 12 + this.arp[(s >> 3) % 4]), .09, "square", .02, delay);
    if (s === 24) tone(f(root), .3, "square", .03, delay, f(root - 5));     // fill
  },
};

/* ---------------- game state ---------------- */
const REP_MAX = 8;   // reputation ceiling (spec 9)

let G = null; // run state
let B = null; // battle state

function newRun(playerCountry, hell = false, endless = false) {
  const others = Object.keys(COUNTRIES).filter(c => c !== playerCountry);
  G = {
    playerCountry,
    hell, endless,
    // 标准/地狱:从其余六国里随机抽三个。无尽:永远续上下一个对手
    queue: endless ? shuffle(others) : shuffle(others).slice(0, 3),
    battleIdx: 0,
    hp: 50, maxHp: 50,
    rep: 8, repFloor: 8,
    deck: starterDeck(playerCountry),
    intervention: false,
    interventionTurn: -99,
    pariah: false,
    dirtyPlayed: false,
    repHitZero: false,
    newAch: [],
    extraPicks: 0,
    over: false,
    totalTurns: 0,
  };
}

function initBattle() {
  while (G.endless && G.battleIdx >= G.queue.length) queueMoreOpponents();
  // 无尽:每一波开场血量回满。难度靠敌人涨,不靠你的血条慢慢磨没
  if (G.endless) G.hp = G.maxHp;
  const id = G.queue[G.battleIdx];
  // 无尽:每三波一个 Boss;标准:只有最后一场
  const boss = G.endless ? (G.battleIdx % 3 === 2) : (G.battleIdx === 2 || G.hell);
  const wave = G.endless ? G.battleIdx : 0;
  const maxHp = COUNTRIES[id].hp + (boss ? (COUNTRIES[id].bossHp ?? 15) : 0) + 8 * wave;
  B = {
    enemy: { id, boss, maxHp, hp: maxHp, wave, block: 0, chest: 10, usaAtk: 4,
             actIdx: 0, annStacks: 0, kamAnn: false, fumesAnn: false, stacks: 0 },
    draw: shuffle(G.deck), discard: [], exhausted: [], hand: [],
    turn: 0, gold: 0,
    permIncome: 0, permAtk: 0,
    incomeDebuffs: [], stealNext: 0, nopeStacks: [],
    playerBlock: 0, thorns: 0, turnAtkBonus: 0,
    suckerPunch: false, allHands: false, rosie: false, noAttacks: false,
    talkItOut: false, enemySkip: false, foresight: false,
    schwerpunkt: false, winterTurns: 0, winterAmt: 2, fundedDisabled: false,
    chainHome: false, chestFrozen: 0,
    shadowEconomy: 0, lootNext: 0, lootArrived: false, stolenTotal: 0,
    oncePlayed: [], handCap: HAND_LIMIT,
    cardsPlayed: 0, ctxFirst: false, playedThisTurn: [], factionThisTurn: [],
    selfHarmTurn: -1, tookDamage: false, lastHandIds: [],
    repStart: G.rep, repFloor: G.rep,
    bankrupt: false, busy: false, won: false,
  };
  renderBattleSkeleton();
  bgm.start(boss);
  startPlayerTurn();
}

/* ---------------- enemy scripts (fixed sequences) ----------------
   Actions carry `funded: cost` when they draw on the War Chest
   (spec 4.2) and are recomputed live so the telegraph never lies. */
function chestGain(e) { return e.id === "usa" ? 2 : 1; }

function enemyAction(idx) {
  const e = B.enemy, boss = e.boss;
  switch (e.id) {
    case "germany": {
      const cyc = Math.floor(idx / 3), pos = idx % 3;
      const d = v => Math.max(0, v - (cyc >= 3 ? 2 : 0));
      if (pos === 0) return { kind: "attack", hits: [d(8)], src: "attack" };
      if (pos === 1) {
        const b = d(boss ? 8 : 6);
        return { kind: "attack", hits: [b, b], src: "blitz", funded: 3, warn: T("warn_blitz") };
      }
      return { kind: "attack", hits: [d(10)], src: "attack" };
    }
    case "soviet": {
      const pos = idx % 3;
      if (pos === 2) return { kind: "block", amount: 6, funded: 2 };
      return { kind: "attack", hits: [5 + sovietStacks() * (boss ? 4 : 3)], src: "attack" };
    }
    case "japan": {
      const pos = idx % 2;
      if (pos === 0) return { kind: "attack", hits: [4], steal: 2, src: "attack" };
      if (e.hp < e.maxHp / 2)
        return { kind: "kamikaze", dmg: boss ? 16 : 12, self: 5, funded: 4, warn: T("warn_divine"), src: "attack" };
      return { kind: "attack", hits: [4], src: "attack" };
    }
    case "china": {
      const pos = idx % 3;
      const p = protractedBonus();
      if (pos === 1) return { kind: "block", amount: 8, funded: 2 };
      return { kind: "attack", hits: [(pos === 0 ? 5 : 7) + p], src: "attack" };
    }
    case "uk": {
      const pos = idx % 3;
      if (pos === 1) return { kind: "attack", hits: [0], steal: 2, chestGain: 3, src: "blockade" };
      if (pos === 2 && idx >= 3)
        return { kind: "attack", hits: [boss ? 19 : 14], funded: 4, src: "bomber", warn: T("warn_bomber") };
      return { kind: "attack", hits: [pos === 0 ? 6 : 9], src: "attack" };
    }
    case "france": {
      const pos = idx % 3;
      if (pos === 2) return { kind: "block", amount: 6, funded: 2 };
      return { kind: "attack", hits: [5 + (franceCornered() ? 5 : 0)], src: "attack" };
    }
    case "usa": {
      if (idx === 7) return { kind: "nuke", dmg: boss ? 52 : 40, warn: T("warn_nuke"), src: "nuke" };
      // project +2 per future funded ramp so Eye in the Sky forecasts honestly
      // (no ramp happens on the nuke turn itself)
      const rampTurns = Math.max(0, idx - e.actIdx - (e.actIdx <= 7 && idx > 7 ? 1 : 0));
      return { kind: "attack", hits: [e.usaAtk + 2 * rampTurns], src: "attack", fundBadge: true };
    }
  }
}

function nextEnemyAction() {
  if (!B || B.enemySkip) return null;
  return enemyAction(B.enemy.actIdx);
}

function sovietStacks() {
  const e = B.enemy;
  if (e.id !== "soviet") return 0;
  // monotonic: once a 25% threshold is crossed the buff never goes away
  const current = clamp(Math.floor(((e.maxHp - e.hp) / e.maxHp) / 0.25), 0, 3);
  e.stacks = Math.max(e.stacks || 0, current);
  return e.stacks;
}
/* 中国:伤害挂在"你花了多少回合"上,而不是"它掉了多少血" */
/* 无尽:每挺过一波,所有敌人的每次攻击 +1 */
function waveBonus() {
  return (B && B.enemy && B.enemy.wave) ? B.enemy.wave : 0;
}

function protractedBonus() {
  if (!B || B.enemy.id !== "china") return 0;
  return 2 * Math.floor(Math.max(0, B.turn - 1) / 3);
}
/* 法国:半血以下才露出獠牙 */
function franceCornered() {
  const e = B && B.enemy;
  return !!e && e.id === "france" && e.hp > 0 && e.hp < e.maxHp / 2;
}

function usaClock() {
  return Math.max(0, 8 - B.enemy.actIdx);
}
function nopeReduction() {
  return B.nopeStacks.length * 3;
}
function germanyFumes() {
  return B.enemy.id === "germany" && Math.floor(B.enemy.actIdx / 3) >= 3;
}
function grossIncome() { return 3 + B.permIncome; }

/* War Chest funding. Yamamoto's Wager eats the next attempt. */
function tryFund(cost) {
  const e = B.enemy;
  if (B.fundedDisabled) { B.fundedDisabled = false; return false; }
  if (e.chest >= cost) { e.chest -= cost; return true; }
  return false;
}

/* ---------------- core mechanics ---------------- */
async function attackEnemy(base, opts = {}) {
  const e = B.enemy;
  if (!e || e.hp <= 0 || G.over || B.won) return { hpDmg: 0 };
  let dmg = base + B.permAtk + B.turnAtkBonus;
  if (B.schwerpunkt) { dmg *= 2; B.schwerpunkt = false; }
  let pierce = !!opts.pierce;
  if (B.suckerPunch) { dmg = Math.round(dmg * 1.5); pierce = true; }
  let remaining = dmg;
  if (!pierce && e.block > 0) {
    const ab = Math.min(e.block, remaining);
    e.block -= ab; remaining -= ab;
    if (ab > 0) popup("#enemy-panel", `🛡️${ab}`, "pop-block");
  }
  if (remaining > 0) {
    e.hp = Math.max(0, e.hp - remaining);
    popup("#enemy-panel", `-${remaining}`, "pop-dmg");
    if (remaining >= 15) { shake(); sfx.bigHit(); } else sfx.hit();
  } else {
    sfx.block();
  }
  afterEnemyDamage();
  updateBattle();
  if (e.hp <= 0) { await sleep(450); await winBattle(); }
  return { hpDmg: remaining };
}

function afterEnemyDamage() {
  const e = B.enemy;
  if (e.hp <= 0) return;
  if (e.id === "soviet") {
    const s = sovietStacks();
    if (s > e.annStacks) {
      e.annStacks = s;
      log(T("log_soviet", s * (e.boss ? 4 : 3)));
      sfx.bad();
    }
  }
  if (e.id === "japan" && !e.kamAnn && e.hp < e.maxHp / 2) {
    e.kamAnn = true;
    log(T("log_divine"));
    sfx.bad();
  }
}

async function enemyHit(raw, { halve = false, src = "attack" } = {}) {
  if (G.over || B.won) return;
  let dmg = raw + (G.intervention ? 3 : 0) + (G.pariah ? 2 : 0) + waveBonus();
  if (B.winterTurns > 0) dmg = Math.max(0, dmg - (B.winterAmt || 2));
  if (B.chainHome) dmg = Math.max(0, dmg - 4);
  if (halve) dmg = Math.floor(dmg / 2);
  dmg = Math.max(0, dmg - nopeReduction());
  const blocked = Math.min(B.playerBlock, dmg);
  B.playerBlock -= blocked;
  const hpDmg = dmg - blocked;
  if (hpDmg > 0) {
    G.hp = Math.max(0, G.hp - hpDmg);
    B.tookDamage = true;
    popup("#player-panel", `-${hpDmg}`, "pop-dmg");
    if (hpDmg >= 15) { shake(); sfx.bigHit(); } else sfx.hit();
  } else if (dmg > 0) {
    popup("#player-panel", T("blocked_pop"), "pop-block");
    sfx.block();
    if (blocked === dmg && B.thorns > 0 && B.enemy.hp > 0) {
      await sleep(220);
      const t = B.thorns;
      B.enemy.hp = Math.max(0, B.enemy.hp - t);
      popup("#enemy-panel", `-${t}`, "pop-dmg");
      log(T("log_thorns", t));
      sfx.hit();
      afterEnemyDamage();
    }
  } else {
    popup("#player-panel", "0", "pop-block");
  }
  updateBattle();
  if (G.hp <= 0) { die(src); return; }
  if (B.enemy.hp <= 0) { await sleep(450); await winBattle(); }
}

function gainBlock(n) {
  B.playerBlock += n;
  popup("#player-panel", `🛡️+${n}`, "pop-block");
  sfx.block();
}
function heal(n) {
  const before = G.hp;
  G.hp = clamp(G.hp + n, 0, G.maxHp);
  popup("#player-panel", `+${G.hp - before}`, "pop-heal");
  sfx.heal();
}
function selfDamage(n) {
  G.hp = Math.max(0, G.hp - n);
  B.selfHarmTurn = B.turn;
  popup("#player-panel", `-${n}`, "pop-dmg");
  sfx.hit();
  updateBattle();
  if (G.hp <= 0) die("self");
}
function gainIncome(n) {
  B.permIncome += n;
  sfx.coin();
  if (grossIncome() >= 8) ach("economist");
}
/* Hand limit is 4 for everyone; Liberty Ships buys the USA a 5th slot.
   Card-driven draw may exceed it (spec 3) — HAND_MAX only keeps the
   hand renderable. */
const HAND_LIMIT = 5;
const HAND_MAX = 10;

function draw(n, autobahn = false, cap = HAND_MAX) {
  for (let k = 0; k < n; k++) {
    if (B.hand.length >= cap) break;
    if (B.draw.length === 0) {
      if (B.discard.length === 0) break;
      B.draw = shuffle(B.discard);
      B.discard = [];
    }
    B.hand.push({ id: B.draw.pop(), disc: autobahn });
  }
}

/* Player steals from the enemy War Chest. Spec 3.2 theft rule:
   the chest loses the gold immediately, but the loot only arrives
   with the player's NEXT income — never this turn's pocket. */
function stealFromChest(n) {
  const e = B.enemy;
  const actual = Math.min(e.chest, n);
  e.chest -= actual;
  if (actual > 0) {
    const gain = actual + B.shadowEconomy;
    B.lootNext += gain;
    B.stolenTotal += actual;
    if (B.stolenTotal >= 15) ach("pickpocket");
    popup("#enemy-panel", `💰-${actual}`, "pop-steal");
    popup("#player-panel", `+${gain} 💰`, "pop-steal");
    log(T("log_stole", gain));
    sfx.coin();
  } else {
    log(T("log_steal_dry"));
    sfx.bad();
  }
  updateBattle();
}

function changeRep(d) {
  G.rep = clamp(G.rep + d, 0, REP_MAX);
  G.repFloor = Math.min(G.repFloor, G.rep);
  B.repFloor = Math.min(B.repFloor, G.rep);
  if (G.rep === 0) G.repHitZero = true;
  if (B.repFloor === 0 && B.repStart >= 8) ach("slippery");
  popup("#rep-box", T("rep_pop", d), d > 0 ? "pop-heal" : "pop-steal");
  if (d < 0) sfx.bad();
  const live = B && !B.won && !G.over && B.enemy && B.enemy.hp > 0;
  if (G.rep <= 2 && !G.intervention) {
    G.intervention = true;
    G.interventionTurn = G.totalTurns;
    // between battles there is no enemy standing to reinforce — the
    // permanent +3 attack still applies via the flag
    if (live) { B.enemy.maxHp += 15; B.enemy.hp += 15; }
    log(T("log_world"));
    banner(T("banner_intervention"), T("banner_intervention_sub"), true);
    sfx.lose(); shake();
  }
  /* Rock bottom: every nation left in the run turns on you. Once per run,
     and Reputation never refills, so there is no way back (spec 9). */
  if (G.rep === 0 && !G.pariah) {
    G.pariah = true;
    log(T("log_pariah"));
    banner(T("banner_pariah"), T("banner_pariah_sub"), true);
    sfx.lose(); shake();
  }
  updateBattle();
}

/* Once-per-battle cards (War Machine): extra copies are dead weight
   for the rest of this battle — the effect caps, per spec 5.5. */
function spentOnce(id) {
  return !!CARDS[id].oncePerBattle && B.oncePlayed.includes(id);
}

/* Faction cards are once per turn each: no chaining two copies of the
   same national trick in one go. Resets every turn. */
function usedThisTurn(id) {
  return !!CARDS[id].faction && B.factionThisTurn.includes(id);
}

function effCost(entry) {
  const c = CARDS[entry.id];
  let cost = c.cost;
  if (entry.id === "night_raid" && B.enemy.chest === 0) cost = 0;
  if (B.allHands) cost -= 1;
  if (B.rosie && c.cat === "bld") cost -= 1;
  if (entry.disc) cost -= 1;
  return Math.max(0, cost);
}

/* ---------------- turn flow ---------------- */
function startPlayerTurn() {
  if (G.over || B.won) return;
  B.turn++; G.totalTurns++;
  B.playerBlock = 0; B.thorns = 0; B.turnAtkBonus = 0;
  B.suckerPunch = false; B.allHands = false; B.rosie = false; B.noAttacks = false;
  B.schwerpunkt = false; B.chainHome = false;
  B.cardsPlayed = 0; B.playedThisTurn = []; B.factionThisTurn = [];
  B.busy = false;

  // 1) income — spec 3.2: enemy theft/debuffs never drive income below 0;
  //    stolen loot arrives on top, one payday late
  let income = 3 + B.permIncome;
  if (G.rep >= 7) income += 1;                 // lend-lease keeps arriving (spec 9.1)
  for (const d of B.incomeDebuffs) { if (d.turns > 0) { income -= d.amt; d.turns--; } }
  B.incomeDebuffs = B.incomeDebuffs.filter(d => d.turns > 0);
  if (B.stealNext > 0) { income -= B.stealNext; B.stealNext = 0; }
  income = Math.max(0, income);
  B.lootArrived = B.lootNext > 0;
  income += B.lootNext;
  B.lootNext = 0;
  // allied field hospitals, only at a spotless record (spec 9.1)
  if (G.rep >= REP_MAX && G.hp < G.maxHp && B.turn > 1) heal(2);
  // 2) upkeep
  B.gold = income - 1;
  B.bankrupt = B.gold < 0;
  if (B.bankrupt) {
    log(T("log_bankrupt"));
    sfx.bad();
  }
  // 3) refill to the hand limit (only this refill respects the cap)
  draw(B.handCap - B.hand.length, false, B.handCap);
  updateBattle();
}

async function playCard(i) {
  if (B.busy || G.over || B.won) return;
  const entry = B.hand[i];
  if (!entry) return;
  const card = CARDS[entry.id];
  const cost = effCost(entry);
  if (spentOnce(entry.id)) { log(T("log_once_spent")); sfx.bad(); return; }
  if (usedThisTurn(entry.id)) { log(T("log_once_turn")); sfx.bad(); return; }
  if (B.gold < cost) { log(T("log_nogold")); sfx.bad(); return; }
  if (card.atk && (B.bankrupt || B.noAttacks)) {
    log(T(B.bankrupt ? "log_strike" : "log_notimeout"));
    sfx.bad();
    return;
  }
  if (card.choice) { openDealModal(i); return; }
  B.busy = true;
  B.gold -= cost;
  B.hand.splice(i, 1);
  B.ctxFirst = B.cardsPlayed === 0;
  B.cardsPlayed++;
  B.playedThisTurn.push(entry.id);
  if (card.dirty) G.dirtyPlayed = true;
  if (card.oncePerBattle) B.oncePlayed.push(entry.id);
  if (card.faction) B.factionThisTurn.push(entry.id);
  sfx.card();
  updateBattle();
  await card.play();
  // signature cards bill Reputation after they resolve (spec 9)
  if (card.sig && card.rep && !G.over && !B.won) changeRep(card.rep);
  if (G.over) return;
  (card.exhaust ? B.exhausted : B.discard).push(entry.id);
  if (["lets_have_it", "double_tap", "sucker_punch"].every(x => B.playedThisTurn.includes(x)))
    ach("textbook");
  B.busy = false;
  if (!B.won) updateBattle();
}

async function endTurn() {
  if (B.busy || G.over || B.won) return;
  B.busy = true;
  sfx.click();
  B.lastHandIds = B.hand.map(h => h.id); // what you were "holding" when the enemy swung
  B.discard.push(...B.hand.map(h => h.id));
  B.hand = [];
  updateBattle();
  await sleep(350);
  await enemyTurn();
}

async function enemyTurn() {
  if (G.over || B.won) return;
  const e = B.enemy;
  e.block = 0;
  // 皇家海军的封锁反过来用:金库停止增长
  if (B.chestFrozen > 0) B.chestFrozen--;
  else e.chest += chestGain(e); // war chest income, even while chilling

  if (B.enemySkip) {
    B.enemySkip = false;
    log(T("log_chill"));
    updateBattle();
    await sleep(750);
    startPlayerTurn();
    return;
  }

  let a = enemyAction(e.actIdx);

  /* Funded moves draw on the War Chest; broke (or sabotaged) enemies downgrade. */
  if (a.funded && !tryFund(a.funded)) {
    if (a.src === "blitz") {
      a = { kind: "attack", hits: [Math.max(0, 6 - (germanyFumes() ? 2 : 0))], src: "attack" };
      log(T("log_blitz_broke"));
    } else if (a.kind === "block") {
      a = null;
      log(T("log_supply_cut"));
    } else if (a.kind === "kamikaze") {
      a = { kind: "attack", hits: [4], src: "attack" };
      log(T("log_divine_broke"));
    }
    sfx.bad();
    updateBattle();
    await sleep(600);
  }

  e.actIdx++;
  const halve = B.talkItOut && a && (a.kind === "attack" || a.kind === "kamikaze" || a.kind === "nuke");
  if (halve) { B.talkItOut = false; log(T("log_letter")); await sleep(350); }

  if (a && a.kind === "attack") {
    for (const h of a.hits) {
      await enemyHit(h, { halve, src: a.src });
      if (G.over || B.won) return;
      await sleep(340);
    }
    if (a.steal) {
      B.stealNext += a.steal;
      e.chest += a.chestGain || a.steal; // 掠夺者把战利品存进自己金库
      popup("#player-panel", `💰-${a.steal}`, "pop-steal");
      sfx.coin();
      log(T("log_steal", a.steal));
    }
  } else if (a && a.kind === "block") {
    e.block += a.amount;
    popup("#enemy-panel", `🛡️+${a.amount}`, "pop-block");
    sfx.block();
  } else if (a && a.kind === "kamikaze") {
    log(T("log_divine"));
    await enemyHit(a.dmg, { halve, src: "attack" });
    if (G.over) return;
    e.hp = Math.max(0, e.hp - a.self);
    popup("#enemy-panel", `-${a.self}`, "pop-dmg");
    updateBattle();
    if (e.hp <= 0) { await sleep(450); await winBattle(); return; }
  } else if (a && a.kind === "nuke") {
    log(T("log_tick"));
    shake(); sfx.nuke();
    await sleep(500);
    await enemyHit(a.dmg, { halve, src: "nuke" });
    if (G.over) return;
  }

  /* USA: escalation is itself a Funded purchase (2 gold per +2).
     The Manhattan Clock does not care about the chest. */
  if (e.id === "usa" && a && a.kind === "attack") {
    if (tryFund(2)) e.usaAtk += 2;
    else { log(T("log_ramp_broke")); sfx.bad(); }
  }

  if (e.id === "germany" && !e.fumesAnn && germanyFumes()) {
    e.fumesAnn = true;
    log(T("log_fumes"));
  }

  // duration ticks
  B.nopeStacks.forEach(s => s.turns--);
  B.nopeStacks = B.nopeStacks.filter(s => s.turns > 0);
  if (B.winterTurns > 0) B.winterTurns--;

  if (G.over || B.won) return;
  updateBattle();
  await sleep(550);
  startPlayerTurn();
}

/* ---------------- win / lose ---------------- */
async function winBattle() {
  if (B.won || G.over) return;
  B.won = true;
  bgm.stop();
  sfx.win();

  ach("baptism");
  (G.beaten = G.beaten || []).push(B.enemy.id);
  ach(`m_${G.playerCountry}_${B.enemy.id}`);
  if (!B.tookDamage) ach("no_scratch");
  polyglotRecord();

  const last = !G.endless && G.battleIdx === 2;
  if (G.endless) {
    G.streak = (G.streak || 0) + 1;
    recordStreak(G.streak);
    if (G.streak >= 5) ach("endless5");
    if (G.streak >= 10) ach("endless10");
    if (new Set(G.beaten || []).size >= 6) ach("world_tour");
  }
  if (last) {
    ach("mission_accomplished");
    if (!G.dirtyPlayed) ach("geneva");
    if (G.repHitZero) ach("war_criminal");
    if (G.hp <= 5) ach("photo_finish");
    if (G.repFloor >= 7) ach("spotless");
    if (G.pariah) ach("rockbottom");
  }

  await banner(T("banner_win"), T("banner_win_sub", coName(B.enemy.id)));
  if (last) { showVictory(); return; }

  // no refill: what you spent is spent for the rest of the run (spec 9)
  showDilemma();
}

function blockCardsInHand() {
  // during the enemy's turn the hand was just discarded — judge the hand
  // the player ended their turn with (Maginot Mindset would be dead otherwise)
  const ids = B.hand.length ? B.hand.map(h => h.id) : (B.lastHandIds || []);
  return ids.filter(id => id === "dig_in" || id === "little_friend").length;
}

function die(src) {
  if (G.over) return;
  G.over = true;
  bgm.stop();
  sfx.lose();
  let cause;
  if (src === "nuke") cause = "NUKED";
  else if (src === "blitz") cause = "BLITZED";
  else if (G.intervention) cause = "PARIAH";
  else if (B.enemy.id === "japan" && B.bankrupt) cause = "BANKRUPTED";
  else if (B.enemy.id === "soviet" && sovietStacks() > 0) cause = "OUTLASTED";
  else cause = "KILLED_IN_ACTION";

  if (cause === "NUKED") ach("read_clock");
  if (src === "blitz" && blockCardsInHand() >= 2) ach("maginot");
  if (B.enemy.id === "soviet" && sovietStacks() >= 3) ach("winter_regards");
  if (B.enemy.id === "japan" && B.bankrupt) ach("broke_dead");
  if (B.selfHarmTurn === B.turn) ach("own_goal");
  if (G.intervention && G.totalTurns - G.interventionTurn <= 3) ach("hague");

  updateBattle();
  setTimeout(() => showDeath(cause), 1000);
}

/* ============================================================
   RENDERING
   ============================================================ */
function popup(sel, text, cls) {
  const target = $(sel);
  if (!target) return;
  const r = target.getBoundingClientRect();
  const d = document.createElement("div");
  d.className = `pop ${cls}`;
  d.textContent = text;
  d.style.left = (r.left + r.width / 2 + (Math.random() * 60 - 30)) + "px";
  d.style.top = (r.top + r.height / 2) + "px";
  $("#fx-layer").appendChild(d);
  setTimeout(() => d.remove(), 1000);
}
function shake() {
  document.body.classList.remove("shake");
  void document.body.offsetWidth;
  document.body.classList.add("shake");
  setTimeout(() => document.body.classList.remove("shake"), 400);
}
function log(msg) {
  const el = $("#battle-log");
  if (!el) return;
  el.textContent = msg;
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
}
function banner(title, subHtml, bad = false) {
  return new Promise(res => {
    const d = document.createElement("div");
    d.className = "banner-overlay";
    d.innerHTML = `<div class="banner"><h2 class="${bad ? "bad" : ""}">${title}</h2>${subHtml ? `<p>${subHtml}</p>` : ""}</div>`;
    document.body.appendChild(d);
    setTimeout(() => {
      d.classList.add("out");
      setTimeout(() => { d.remove(); res(); }, 300);
    }, 1500);
  });
}

function flagHtml(id, cls = "") {
  // pixel sprite when canvas is available, emoji flag otherwise
  const img = pixImg("countries", id, "pix-co");
  if (img) return `<span class="pixwrap ${cls}">${img}</span>`;
  const c = COUNTRIES[id];
  const soviet = id === "soviet" ? " soviet-flag" : "";
  return `<span class="${cls}${soviet}">${c.flag}</span>`;
}

function cardHtml(id, { click = "", disabled = false, showCost = null, big = false } = {}) {
  const c = CARDS[id];
  const cost = showCost === null ? c.cost : showCost;
  const cls = `card ${c.cat}${c.dirty ? " dirty" : ""}${disabled ? " unplayable" : ""}${big ? " big" : ""}`;
  const tag = click ? "button" : "div";
  const art = pixImg("cards", id, "pix-card");
  const facBadge = c.faction
    ? `<div class="cfaction">${c.sig ? "★" : ""}${pixImg("countries", c.faction, "pix-mini") || COUNTRIES[c.faction].flag}</div>`
    : "";
  return `<${tag} class="${cls}" ${click ? `onclick="${click}"` : ""}>
    <div class="cost${cost < c.cost ? " discount" : ""}">${cost}</div>
    ${c.rep ? `<div class="repcost">${T("rep_short")} ${c.rep}</div>` : ""}
    ${facBadge}
    ${art ? `<div class="cart">${art}</div>` : ""}
    <div class="cname">${esc(cardName(id))}</div>
    <div class="ctext">${esc(cardText(id))}</div>
    <div class="cflavor">${esc(cardFlavor(id))}</div>
  </${tag}>`;
}

function intentHtml(a, future = false) {
  if (!a) return "";
  const e = B.enemy;
  const iv = (G.intervention ? 3 : 0) + (G.pariah ? 2 : 0) + waveBonus();
  const winter = (B.winterTurns > 0 ? (B.winterAmt || 2) : 0) + (B.chainHome ? 4 : 0);
  const adj = v => Math.max(0, v + iv - winter);
  let txt = "", warn = false;
  if (a.kind === "attack") {
    const per = adj(a.hits[0]);
    txt = `⚔️${a.hits.length > 1 ? `${per}×${a.hits.length}` : per}`;
    if (a.steal) txt += ` 💰-${a.steal}`;
    if (a.src === "blitz") warn = true;
  } else if (a.kind === "block") {
    txt = `🛡️${a.amount}`;
  } else if (a.kind === "kamikaze") {
    txt = `🔥${adj(a.dmg)}`;
    warn = true;
  } else if (a.kind === "nuke") {
    txt = `☢${adj(a.dmg)}`;
    warn = true;
  }
  let badge = "";
  if (a.funded || a.fundBadge) {
    const broke = B.fundedDisabled || (a.funded && e.chest + chestGain(e) < a.funded);
    badge = `<span class="fund${broke ? " broke" : ""}">💰${a.funded || ""}</span>`;
  }
  return `<span class="intent${warn ? " warn" : ""}${future ? " future" : ""}">${txt}${badge}</span>`;
}

function updateBattle() {
  if (!B || !$("#enemy-panel")) return;
  const e = B.enemy;

  // enemy
  $("#enemy-hp-fill").style.width = (100 * e.hp / e.maxHp) + "%";
  $("#enemy-hp-text").textContent = `❤️ ${e.hp}/${e.maxHp}`;
  $("#enemy-chest").textContent = `💰 ${e.chest}`;
  $("#enemy-block").textContent = e.block > 0 ? `🛡️ ${e.block}` : "";

  // usa clock
  const clockEl = $("#usa-clock");
  if (e.id === "usa") {
    clockEl.style.display = "block";
    clockEl.textContent = e.actIdx > 7 ? T("boom") : `☢ ${usaClock()}`;
  }

  // enemy statuses
  const es = [];
  if (e.id === "soviet" && sovietStacks() > 0)
    es.push(`<span class="chip warnchip">${T("chip_soviet", sovietStacks() * (e.boss ? 4 : 3))}</span>`);
  if (e.id === "japan" && e.hp < e.maxHp / 2 && e.hp > 0)
    es.push(`<span class="chip warnchip">${T("chip_divine")}</span>`);
  if (germanyFumes())
    es.push(`<span class="chip">${T("chip_fumes")}</span>`);
  if (G.intervention)
    es.push(`<span class="chip warnchip">${T("chip_intervention")}</span>`);
  if (G.pariah)
    es.push(`<span class="chip warnchip">${T("chip_pariah")}</span>`);
  if (B.fundedDisabled)
    es.push(`<span class="chip">${T("chip_funded_off")}</span>`);
  if (B.winterTurns > 0)
    es.push(`<span class="chip">${T("chip_winter", B.winterTurns)}</span>`);
  $("#enemy-status").innerHTML = es.join("");

  /* Intents are classified. Without recon you are guessing — Eye in the
     Sky is what buys you the enemy's plan (spec 3.1). */
  let intents, warnMsg = null;
  if (B.won || e.hp <= 0) {
    intents = "";
  } else if (!B.foresight) {
    intents = `<span class="intent unknown">${T("intent_unknown")}</span>`;
  } else if (B.enemySkip) {
    intents = `<span class="intent">${T("skipping")}</span>` + intentHtml(enemyAction(e.actIdx), true);
  } else {
    const next = enemyAction(e.actIdx);
    intents = intentHtml(next) + intentHtml(enemyAction(e.actIdx + 1), true);
    if (next.warn) warnMsg = next.warn;
    else {
      // Blitzkrieg gets an extra turn of warning (spec 3.1 / 6.1)
      const after = enemyAction(e.actIdx + 1);
      if (after && after.src === "blitz") warnMsg = T("warn_blitz_early");
    }
  }
  $("#intents").innerHTML = intents;
  const wt = $("#warn-text");
  if (warnMsg) { wt.style.display = "block"; wt.textContent = warnMsg; }
  else wt.style.display = "none";

  // rep
  $("#rep-fill").style.width = (100 * G.rep / REP_MAX) + "%";
  $("#rep-fill").style.background = G.rep >= 7 ? "var(--green)" : G.rep >= 3 ? "var(--amber)" : "var(--dirty)";
  $("#rep-title").textContent = `${G.rep} · ${repTitle(G.rep)}`;

  // player
  $("#player-hp-fill").style.width = (100 * G.hp / G.maxHp) + "%";
  $("#player-hp-text").textContent = `❤️ ${G.hp}/${G.maxHp}`;
  $("#player-block").textContent = B.playerBlock > 0 ? `🛡️ ${B.playerBlock}` : "";
  const goldEl = $("#gold-text");
  goldEl.textContent = `💰 ${B.gold}`;
  goldEl.classList.toggle("broke", B.bankrupt);

  const nextIncome = Math.max(0, 3 + B.permIncome
    - B.incomeDebuffs.reduce((s, d) => s + (d.turns > 0 ? d.amt : 0), 0)
    - B.stealNext) + B.lootNext - 1;
  $("#income-note").textContent = T("payday", nextIncome);

  const ps = [];
  if (B.bankrupt) ps.push(`<span class="chip warnchip">${T("chip_strike")}</span>`);
  if (B.noAttacks && !B.bankrupt) ps.push(`<span class="chip">${T("chip_timeout")}</span>`);
  if (B.permAtk > 0) ps.push(`<span class="chip">${T("chip_permatk", B.permAtk)}</span>`);
  if (B.turnAtkBonus > 0) ps.push(`<span class="chip">${T("chip_turnatk", B.turnAtkBonus)}</span>`);
  if (B.schwerpunkt) ps.push(`<span class="chip">${T("chip_schwerpunkt")}</span>`);
  if (B.suckerPunch) ps.push(`<span class="chip">${T("chip_sucker")}</span>`);
  if (B.permIncome > 0) ps.push(`<span class="chip">${T("chip_income", B.permIncome)}</span>`);
  if (G.rep >= 7) ps.push(`<span class="chip">${T("chip_aid")}</span>`);
  if (G.rep >= REP_MAX) ps.push(`<span class="chip">${T("chip_aid_max")}</span>`);
  if (B.oncePlayed.includes("war_machine")) ps.push(`<span class="chip">${T("chip_wm_spent")}</span>`);
  if (B.handCap > HAND_LIMIT) ps.push(`<span class="chip">${T("chip_handcap", B.handCap)}</span>`);
  if (B.lootNext > 0) ps.push(`<span class="chip">${T("chip_loot", B.lootNext)}</span>`);
  if (B.lootArrived) ps.push(`<span class="chip">${T("chip_loot_in")}</span>`);
  if (B.shadowEconomy > 0) ps.push(`<span class="chip">${T("chip_shadow", B.shadowEconomy)}</span>`);
  if (B.nopeStacks.length) ps.push(`<span class="chip">${T("chip_nope", nopeReduction(), Math.max(...B.nopeStacks.map(s => s.turns)))}</span>`);
  if (B.talkItOut) ps.push(`<span class="chip">${T("chip_talk")}</span>`);
  if (B.thorns > 0) ps.push(`<span class="chip">${T("chip_thorns", B.thorns)}</span>`);
  if (B.allHands) ps.push(`<span class="chip">${T("chip_allhands")}</span>`);
  if (B.rosie) ps.push(`<span class="chip">${T("chip_rosie")}</span>`);
  if (B.foresight) ps.push(`<span class="chip">${T("chip_recon")}</span>`);
  ps.push(...B.incomeDebuffs.map(d => `<span class="chip warnchip">${T("chip_debuff", d.amt, d.turns)}</span>`));
  if (B.stealNext > 0) ps.push(`<span class="chip warnchip">${T("chip_steal", B.stealNext)}</span>`);
  $("#player-status").innerHTML = ps.join("");

  // hand
  $("#hand").innerHTML = B.hand.map((entry, i) => {
    const c = CARDS[entry.id];
    const cost = effCost(entry);
    const disabled = B.gold < cost || spentOnce(entry.id) || usedThisTurn(entry.id)
      || (c.atk && (B.bankrupt || B.noAttacks));
    return cardHtml(entry.id, { click: `UI.play(${i})`, disabled, showCost: cost });
  }).join("");

  // piles + button
  $("#pile-info").textContent = T("piles", B.draw.length, B.discard.length, B.exhausted.length);
  $("#send-it").disabled = B.busy || B.won || G.over;
}

/* 无尽模式:对手永远续得上,且不会连着重复同一个 */
function queueMoreOpponents() {
  const others = Object.keys(COUNTRIES).filter(c => c !== G.playerCountry);
  let next = shuffle(others);
  if (next[0] === G.queue[G.queue.length - 1] && next.length > 1)
    [next[0], next[1]] = [next[1], next[0]];
  G.queue = G.queue.concat(next);
}

/* 最长连胜是无尽模式唯一的跨局存档 */
function bestStreak() {
  try { return parseInt(localStorage.getItem("we_streak") || "0", 10) || 0; }
  catch (e) { return 0; }
}
function recordStreak(n) {
  try { if (n > bestStreak()) localStorage.setItem("we_streak", String(n)); }
  catch (e) { /* 无痕模式等 */ }
}

/* ---------------- between-battle dilemmas (spec 9.2) ----------------
   One randomly drawn deal after each victory, priced in Reputation, HP,
   or the card reward itself. Declining is always free. */
const DILEMMAS = [
  { id: "salvage",     rep: -2, heal: 14 },
  { id: "requisition", rep: -2, extraPick: true },
  { id: "accords",     rep: 3,  hp: -8 },
  { id: "amnesty",     rep: 3,  skipReward: true },
];

let currentDilemma = null;

function showDilemma() {
  rerender = showDilemma;
  // keep the same offer if the player switches language while deciding
  if (!currentDilemma) {
    const pool = DILEMMAS.filter(d => !(d.hp && G.hp + d.hp <= 0));  // never offer a suicide deal
    currentDilemma = shuffle(pool.length ? pool : DILEMMAS)[0];
  }
  const d = currentDilemma;
  $("#app").innerHTML = `
  <div class="screen">
    <span class="vs-badge">${T("dilemma_badge")}</span>
    <h1 class="screen-title">${T("dil_" + d.id + "_name")}</h1>
    <p class="intro-quote">“${esc(T("dil_" + d.id + "_flavor"))}”</p>
    <div class="intel">📋 ${T("dil_" + d.id + "_desc")}</div>
    <div class="dil-row">
      <button class="btn" onclick="UI.dilemma(true)">${T("dil_accept")}</button>
      <button class="btn ghost" onclick="UI.dilemma(false)">${T("dil_decline")}</button>
    </div>
    <div class="mini-stats">${T("ministats", G.hp, G.maxHp, G.rep, repTitle(G.rep), G.deck.length)}</div>
  </div>`;
}

function resolveDilemma(accept) {
  const d = currentDilemma;
  currentDilemma = null;
  if (!accept) { sfx.click(); showReward(); return; }
  sfx.card();
  if (d.hp) { G.hp = Math.max(1, G.hp + d.hp); sfx.hit(); }
  if (d.heal) { G.hp = clamp(G.hp + d.heal, 0, G.maxHp); sfx.heal(); }
  if (d.rep) changeRep(d.rep);
  if (d.extraPick) G.extraPicks = (G.extraPicks || 0) + 1;
  if (d.skipReward) { nextBattle(); return; }
  showReward();
}

function nextBattle() {
  G.battleIdx++;
  rewardPicks = null;
  showBattleIntro();
}

/* Spec 2: reward pool = shared pool + own faction pool, faction ×1.5.
   奖励不给你已经有的牌——三张全是牌组里的旧牌等于没得选。
   只有在无尽模式里把所有牌都收齐之后,才会退回去允许重复。 */
function rollRewards() {
  const owned = new Set(G.deck);
  const all = [];
  for (const id of SHARED_IDS) all.push({ id, w: CARDS[id].rewardWeight || 2 });
  for (const id of FACTIONS[G.playerCountry].pool) all.push({ id, w: (CARDS[id].rewardWeight || 2) * 1.5 });
  let items = all.filter(x => !owned.has(x.id));
  if (items.length < 3) items = items.concat(all.filter(x => owned.has(x.id)));
  const picks = [];
  while (picks.length < 3 && items.length) {
    const total = items.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * total, idx = 0;
    for (let i = 0; i < items.length; i++) { r -= items[i].w; if (r <= 0) { idx = i; break; } }
    picks.push(items[idx].id);
    items.splice(idx, 1);
  }
  return picks;
}

function showReward() {
  rerender = showReward;
  // keep the same three cards if the player switches language mid-choice
  if (!rewardPicks) rewardPicks = rollRewards();
  const cards = rewardPicks.map(id => cardHtml(id, { click: `UI.pickReward('${id}')` })).join("");
  $("#app").innerHTML = `

}

    nextBattle();
  },
  dilemma(accept) { resolveDilemma(accept); },
  restart() { sfx.click(); rewardPicks = null; currentDilemma = null; showTitle(); },
  showAch() { sfx.click(); showAchModal(); },
  openLangPicker() {
    if (runLocked) return;
    sfx.click();
    showLangModal();
  },
  setLanguage(code) {
    if (runLocked) { UI.closeModal(); return; }  // never swap language mid-run
    setLang(code);
    sfx.click();
    UI.closeModal();
    rerender();          // redraw the current screen in the new language
  },
  toggleMute() {
    muted = !muted;
    const b = $("#mute-btn");
    if (b) b.textContent = muted ? "🔇" : "🔊";
    if (muted) bgm.pause(); else bgm.resume();
    sfx.click();
  },
  showDeck() { sfx.click(); showDeckModal(); },
  closeModal() { $("#modal-root").innerHTML = ""; },
  async dealChoice(handIdx, which) {
    UI.closeModal();
    if (B.busy || G.over || B.won) return;
    B.busy = true;
    B.hand.splice(handIdx, 1);
    B.discard.push("art_deal");
    B.cardsPlayed++;
    B.playedThisTurn.push("art_deal");
    sfx.card();
    if (which === "sell") {
      B.gold += 4;
      popup("#player-panel", "+4 💰", "pop-steal");
      sfx.coin();
      changeRep(-1);
      log(T("log_sold"));
    } else {
      B.gold -= 3;
      changeRep(1);
      log(T("log_respect"));
    }
    B.busy = false;
    updateBattle();
  },
};

/* ---------------- boot ---------------- */
setLang(detectLang());
showTitle();

</script>
</body>
</html>
